spring:
  application:
    name: workbench-perf-a7
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Shanghai
  web:
    resources:
      static-locations: classpath:/static/,file:./frontend/dist/,file:../frontend/dist/
      cache:
        cachecontrol:
          no-cache: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      probes:
        enabled: true
